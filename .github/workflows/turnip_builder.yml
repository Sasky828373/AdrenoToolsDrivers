name: Build "turnip"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: true
        type: string

permissions:
  contents: write

jobs:
  start_building_turnip:
    runs-on: ubuntu-24.04

    env:
      BUILD_VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' \
            /etc/apt/sources.list.d/ubuntu.sources

          sudo apt update
          sudo apt install -y \
            build-essential \
            flex \
            bison \
            glslang-tools

          sudo apt install -y meson-1.5

      - name: Execute build script
        run: bash ./turnip_builder.sh

      # Wichtig:
      # Beide fertigen Treiber-ZIPs unabhängig vom GitHub Release sichern.
      # Damit bleibt insbesondere unser gepatchter turnip-sync Build
      # verfügbar, selbst wenn action-gh-release einen HTTP-500 bekommt.
      - name: Upload Turnip build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: turnip-${{ inputs.version }}
          path: |
            /tmp/mainline-turnip-V${{ inputs.version }}.zip
            /tmp/mainline-turnip-sync-V${{ inputs.version }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Release "turnip"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tu_v${{ inputs.version }}
          name: Mainline Turnip v${{ inputs.version }}

          body: |
            Mainline Turnip Vulkan V${{ inputs.version }}

            Built from:
            https://github.com/whitebelyash/mesa-unified
            Branch: turnip/gen8

            > [!WARNING]
            > Please don't report issues to Mesa.

            Supported GPUs:

            * Adreno 8XX Family: 840, 830, 829, 825, 810
            * Adreno 7XX Family: any GPU supported by upstream Turnip
              plus 710/720/722 (unstable, sysmem only)
            * Adreno 6XX Family: any GPU supported by upstream Turnip

            Notes:

            * Disable DXVK_HUD if you see weird black artifacts.
            * Some games may require AMD/NVIDIA identification.
              TU_DEBUG=deck_emu can be used where appropriate.
            * GMEM may cause problems on some A830 configurations.
              TU_DEBUG=sysmem can be used as a fallback.

            V46 A840 build:
            The turnip-sync package contains the patches applied by
            turnip_builder.sh, including the V46 A840 GTA V optimization.

          files: |
            /tmp/mainline-turnip-V${{ inputs.version }}.zip
            /tmp/mainline-turnip-sync-V${{ inputs.version }}.zip
